masters = gentoo
thin-manifests = true
sign-manifests = false
# ::gentoo's restrict-allowed list verbatim, plus network-sandbox. Portage has
# always honoured that token, but ::gentoo does not declare it, so every ebuild
# here that must fetch at build time (Go module caches, CMake FetchContent)
# tripped pkgcheck's UnknownRestrict. A child repo REPLACES the master's list
# rather than extending it, hence the full set.
restrict-allowed = binchecks bindist fetch installsources mirror network-sandbox preserve-libs splitdebug strip test userpriv
