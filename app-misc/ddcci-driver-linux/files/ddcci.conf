# DDC/CI monitor control.
#
# Only ddcci is listed, and it has to be: it discovers monitors by walking the
# i2c adapters itself, so it carries no modalias and nothing ever autoloads it
# — that is exactly what "Failed to find module 'ddcci'" in a hand-written
# /etc/modules-load.d/ddc.conf is really reporting.
#
# ddcci-backlight is deliberately NOT listed: it declares
# 'alias: ddcci:monitor-*-*-*-*' (verified with modinfo on the built module),
# so udev loads it by itself as soon as ddcci registers a monitor. Listing it
# here would only make it load early on machines that have no DDC/CI monitor.
#
# i2c-dev is likewise absent: the image kernels build it in
# (CONFIG_I2C_CHARDEV=y, hardware.fragment), and these modules do not use
# /dev/i2c-* anyway — userspace does (ddcutil, ddcui, OpenRGB).
ddcci
