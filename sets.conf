# Repository-level package sets, discovered by portage through this file.
#
# They exist so a live image can reference KDE Gear groups without
# configuring ::kde, which is where these lists live upstream. Every atom in
# them resolves in ::gentoo; only the grouping came from ::kde.
#
# The names carry a 'pwr-' prefix on purpose: this repo is synced onto hosts
# that also have ::kde, and two repos defining a set of the same name means
# one silently wins. A prefixed name can never shadow the upstream one.
[pwr sets]
class = portage.sets.files.StaticFileSet
multiset = true
directory = ${repository:pwr}/sets/
world-candidate = True
