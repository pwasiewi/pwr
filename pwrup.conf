# pwrup check — per-package release filters.
# Format: cat/pkg <regex an asset name must match for a release to count>.
# Use when an upstream publishes several channels as full GitHub releases
# (brave marks nightlies/betas non-prerelease; the channel is only visible
# in the asset name: brave-browser_X = stable, brave-browser-nightly_X ...).
www-client/brave-bin  ^brave-browser_[0-9.]+_amd64\.deb$
