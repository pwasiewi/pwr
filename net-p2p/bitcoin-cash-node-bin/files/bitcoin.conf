# BCHN configuration — see `bitcoind -help` / doc.bitcoincashnode.org.
# The service runs with -datadir=/var/lib/bitcoind; RPC auth defaults to the
# cookie file there (readable by user/group bitcoin) — no password needed for
# local ckpool/bitcoin-cli running as the bitcoin user.

server=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1

# Uncomment for explicit RPC credentials instead of the cookie
# (this file is root:bitcoin 0640 for that reason):
#rpcuser=bch
#rpcpassword=CHANGE-ME

# Solo-pool block notifications: ckpool/EloPool polls RPC on its own
# ("blockpoll"), but zmq push cuts template latency if enabled:
#zmqpubhashblock=tcp://127.0.0.1:28332

# Resource trims for a small box (Pi): cap connections, no listen needed
# if this node only serves the local pool:
#maxconnections=24
#dbcache=1024
